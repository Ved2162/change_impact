<div>
  <div class="ci-meter-row">
    <span class="ci-meter-label">{{ label }}</span>
    <span class="ci-meter-value" style="color:{{ tone }};">{{ value }}<span class="ci-text-3" style="font-size:10px;">/100</span></span>
  </div>
  <div class="ci-meter-track">
    <div class="ci-meter-fill" style="width:{{ value }}%;background:{{ tone }};"></div>
  </div>
</div>
